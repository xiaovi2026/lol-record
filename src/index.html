<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoL Record - 英雄联盟对局录像分析</title>
  </head>

  <body>
    <div class="app-layout main-window">
      <!-- 1. Header: 软件名称, 版本号, GitHub链接 -->
      <header class="app-header">
        <div class="header-brand">
          <div class="logo-wrapper">
            <img src="icon.png" class="logo-icon-img" alt="LoL Record Logo" />
          </div>
          <div>
            <h1 class="app-title">LoL Record</h1>
            <span class="app-subtitle">英雄联盟对局录像分析</span>
          </div>
        </div>

        <div class="header-actions">
          <span class="version-tag" id="version-text">v0.4.1</span>
          <button class="btn btn-secondary btn-sm" id="btn-github" title="访问 GitHub 开源主页">
            <svg class="svg-icon-sm" viewBox="0 0 24 24">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>GitHub</span>
          </button>
        </div>
      </header>

      <!-- Main Body -->
      <main class="page-body main-body">
        
        <!-- 2. 英雄联盟客户端状态卡片 -->
        <section class="glass-card status-card" id="card-lcu">
          <div class="card-header">
            <div class="card-title-group">
              <div class="card-icon-circle icon-danger" id="lcu-indicator">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M17 5H7a6 6 0 0 0-6 6v4a6 6 0 0 0 6 6h10a6 6 0 0 0 6-6v-4a6 6 0 0 0-6-6zm-8 9H7v2H6v-2H4v-1h2v-2h1v2h2v1zm4.5-.5a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm2.5 2.5a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm0-4a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm2.5 1.5a1 1 0 1 1 1-1 1 1 0 0 1-1 1z"/>
                </svg>
              </div>
              <div>
                <h3>英雄联盟客户端状态</h3>
                <p class="card-status-label" id="lcu-status-text">未检测到客户端运行</p>
              </div>
            </div>
            <span class="badge badge-danger" id="lcu-badge">未连接</span>
          </div>

          <!-- Admin Notice & Restart Button -->
          <div class="admin-notice" id="admin-notice-box" style="display: none;">
            <div class="admin-notice-text">
              <span>⚠️ 英雄联盟（国服/WeGame）以管理员权限运行，需以管理员身份运行本程序以连接客户端。</span>
            </div>
            <button class="btn-warning" id="btn-restart-admin">
              🛡️ 以管理员身份重启
            </button>
          </div>

          <!-- Summoner Profile (Connected) -->
          <div class="summoner-profile" id="summoner-profile-box" style="display: none;">
            <div class="summoner-avatar-placeholder">⚔️</div>
            <div class="summoner-meta">
              <div class="summoner-name" id="summoner-name">-</div>
              <div class="summoner-level" id="summoner-level">Lv. -</div>
            </div>
          </div>
        </section>

        <!-- 3. 文件选择框(支持拖拽) -->
        <section class="glass-card dropzone-card" id="dropzone">
          <div class="dropzone-inner" id="dropzone-content">
            <div class="dropzone-icon">
              <svg class="svg-icon-lg" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
              </svg>
            </div>
            <h3 class="dropzone-title">拖拽录像视频文件到此处</h3>
            <p class="dropzone-subtitle">请导入英雄联盟官方「英雄时刻」录制的对局视频 (.mp4)</p>
            <button class="btn btn-primary" id="btn-select-file">
              <span>📁 浏览本地录像文件</span>
            </button>
          </div>
          <div class="dropzone-overlay" id="dropzone-overlay">
            <div class="dropzone-overlay-content">
              <span class="dropzone-overlay-icon">📥</span>
              <span>释放鼠标导入录像文件</span>
            </div>
          </div>
        </section>

      </main>
    </div>
  </body>
</html>
